[package]
name = "tothboost"
version = "1.0.0"
edition = "2021"
authors = ["Gabriel Toth"]
description = "High Performance, Zero-Overhead Windows 10/11 Gaming Optimizer in Native Rust + Win32"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_TaskScheduler",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Graphics_Gdi",
    "Win32_Security"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
