name: Build & Test Native Rust TothBoost

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cargo Test (Rust Native)
      working-directory: ./src/tothboost-rs
      run: cargo test --verbose

    - name: Build Release Binary
      working-directory: ./src/tothboost-rs
      run: cargo build --release --verbose

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TothBoost-Rust-Win32-x64
        path: src/tothboost-rs/target/release/tothboost.exe
