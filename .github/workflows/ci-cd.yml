name: TothBoost CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build & Run Tests
        run: dotnet test --no-restore --verbosity normal

  publish:
    name: Build & Release Standalone Executable (.exe)
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Single-File Standalone Executable
        run: |
          dotnet publish src/TothBoost.App/TothBoost.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/

      - name: Rename Executable for Release
        shell: powershell
        run: |
          if (Test-Path "publish/TothBoost.App.exe") {
              Copy-Item "publish/TothBoost.App.exe" "publish/TothBoost.exe" -Force
          }

      - name: Upload Build Artifact (Standalone .exe)
        uses: actions/upload-artifact@v4
        with:
          name: TothBoost-Windows-x64
          path: publish/TothBoost.exe

      - name: Create GitHub Release & Attach Executable
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/TothBoost.exe
          name: "TothBoost ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
